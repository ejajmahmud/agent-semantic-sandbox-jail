[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-semantic-sandbox-jail"
version = "0.1.0"
description = "AST-based deterministic sandbox restricting Python code execution to safe syscalls and memory boundaries without container overhead"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-semantic-sandbox-jail = "agent_semantic_sandbox_jail.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_semantic_sandbox_jail*"]
